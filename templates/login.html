<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng Nhập Quản Trị - SEB System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-box {
            box-shadow: 0 0 35px -5px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-blue-600 selection:text-white relative overflow-hidden">

    <!-- Ambient glowing backgrounds -->
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-blue-600/20 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-indigo-600/20 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md space-y-6 relative z-10">
        
        <!-- Logo & Header -->
        <div class="text-center space-y-3">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 mx-auto flex items-center justify-center text-white text-2xl shadow-xl shadow-blue-500/25 border border-white/10">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight">Cổng Quản Trị Hệ Thống</h1>
                <p class="text-xs text-slate-400 mt-1">Phân Phối & Kích Hoạt Bản Quyền SEB Online</p>
            </div>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl glow-box space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Mật Khẩu Quản Trị Viên</label>
                <div class="relative">
                    <input type="password" id="input-password" placeholder="Nhập mật khẩu quản trị..."
                        class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition placeholder-slate-500 pr-11"
                        onkeypress="if(event.key==='Enter') doLogin()">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition">
                        <i id="eye-icon" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Error message container -->
            <div id="error-msg" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation text-rose-400"></i>
                <span id="error-text">Mật khẩu không chính xác!</span>
            </div>

            <button id="btn-login" onclick="doLogin()"
                class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.99] font-bold text-sm rounded-xl transition shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 text-white">
                <i class="fa-solid fa-lock-open text-xs"></i> Đăng Nhập Hệ Thống
            </button>
        </div>

        <!-- Back Link -->
        <div class="text-center">
            <a href="/" class="text-xs text-slate-500 hover:text-blue-400 transition inline-flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Quay lại trang học sinh
            </a>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById("input-password");
            const icon = document.getElementById("eye-icon");
            if (input.type === "password") {
                input.type = "text";
                icon.className = "fa-regular fa-eye-slash";
            } else {
                input.type = "password";
                icon.className = "fa-regular fa-eye";
            }
        }

        async function doLogin() {
            const password = document.getElementById("input-password").value;
            const errBox = document.getElementById("error-msg");
            const btn = document.getElementById("btn-login");

            errBox.classList.add("hidden");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> Đang xác thực...';

            try {
                const res = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({password: password})
                });

                const data = await res.json();
                if (data.success) {
                    btn.innerHTML = '<i class="fa-solid fa-check text-xs"></i> Thành công! Đang chuyển hướng...';
                    window.location.href = "/admin";
                } else {
                    errBox.classList.remove("hidden");
                    document.getElementById("error-text").innerText = data.message || "Mật khẩu không đúng!";
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-lock-open text-xs"></i> Đăng Nhập Hệ Thống';
                }
            } catch (err) {
                errBox.classList.remove("hidden");
                document.getElementById("error-text").innerText = "Lỗi kết nối máy chủ!";
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-lock-open text-xs"></i> Đăng Nhập Hệ Thống';
            }
        }
    </script>
</body>
</html>
